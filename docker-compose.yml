services:
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql

  mysql-user:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_user_data:/var/lib/mysql

  mysql-workflow:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workflow_db
    ports:
      - "3309:3306"
    volumes:
      - mysql_workflow_data:/var/lib/mysql

  mysql-attendance:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_db
    ports:
      - "3310:3306"
    volumes:
      - mysql_attendance_data:/var/lib/mysql

  mysql-notices:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notices_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_notices_data:/var/lib/mysql

volumes:
  mysql_auth_data:
  mysql_user_data:
  mysql_workflow_data:
  mysql_attendance_data:
  mysql_notices_data:
